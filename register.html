<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=undo" />
</head>
<body>
    
<main class="register-page">
    <div class="register-container">
        <!-- 🔙 ปุ่มย้อนกลับ (เน้นให้กดง่ายขึ้น) -->
        <div class="pumblack">
            <a href="login.html" id="back-to-login">
                <span class="material-symbols-outlined">undo</span>
            </a>
        </div>
        
        <h2>สมัครสมาชิก</h2>
        
        <div id="register-form-box">
            <div class="input-group">
                <label for="reg_user">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="reg_user" maxlength="15" minlength="3" autocomplete="username" placeholder="Username (3–15 ตัวอักษร)" required>
            </div>
            <div class="input-group">
                <label for="reg_pass">รหัสผ่าน</label>
                <input type="password" id="reg_pass" maxlength="15" minlength="6" autocomplete="new-password" placeholder="Password (6–15 ตัวอักษร)" required>
            </div>
            <div class="input-group">
                <label for="reg_confirm_pass">ยืนยันรหัสผ่าน</label>
                <input type="password" id="reg_confirm_pass" maxlength="15" minlength="6" autocomplete="new-password" placeholder="Confirm Password" required>
            </div>
            
            <button type="button" id="btn-create-acc" class="register-btn">สร้างบัญชี</button>
        </div>
        
        <!-- 🔗 ปุ่มเข้าสู่ระบบ (จุดที่มีปัญหา) -->
        <p class="login-link">
            มีบัญชีอยู่แล้ว? <a href="login.html" id="direct-login-link">เข้าสู่ระบบ</a>
        </p>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBF5t68YK-QDAC026L6c_OFYeCP-y3RHoA",
        authDomain: "wep-project-by-baross.firebaseapp.com",
        databaseURL: "https://wep-project-by-baross-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "wep-project-by-baross",
        storageBucket: "wep-project-by-baross.firebasestorage.app",
        messagingSenderId: "561116818071",
        appId: "1:561116818071:web:111006b44f0d0e8b3d57d2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const usernameToEmail = (username) =>
        `${username.toLowerCase()}@users.wep-project-by-baross.firebaseapp.com`;

    // --- 🌈 ฟังก์ชันเรียกหลอดโหลด (เชื่อม CSS .custom-alert ตรงๆ) ---
    function showCustomAlert(message, type = 'success') {
        // ลบอันเก่าออกก่อนกันซ้อน
        const oldAlert = document.querySelector('.custom-alert');
        if (oldAlert) oldAlert.remove();

        const alertBox = document.createElement('div');
        alertBox.className = 'custom-alert';
        
        // เช็คประเภทเพื่อเลือกสีหลอด (รุ้ง/แดง) และไอคอน ✅/❌
        const barClass = type === 'success' ? 'progress-active' : 'progress-error';
        const icon = type === 'success' ? '✅' : '❌'; 
        const content = document.createElement('div');
        content.className = 'alert-content';
        const iconElement = document.createElement('span');
        iconElement.className = 'alert-icon';
        iconElement.textContent = icon;
        const messageElement = document.createElement('span');
        messageElement.className = 'alert-message';
        messageElement.textContent = message;
        const progress = document.createElement('div');
        progress.className = `progress-bar ${barClass}`;
        content.append(iconElement, messageElement);
        alertBox.append(content, progress);
        
        document.body.appendChild(alertBox);

        // สั่งให้ค่อยๆ ปรากฏ (Opacity)
        setTimeout(() => { alertBox.style.opacity = '1'; }, 10);

        // หายไปหลังจากหลอดวิ่งเสร็จ (2 วินาที)
        setTimeout(() => {
            alertBox.style.opacity = '0';
            setTimeout(() => alertBox.remove(), 500);
        }, 2000);
    }

    // --- 🔑 ระบบสมัครสมาชิก ---
    document.getElementById('btn-create-acc').onclick = async () => {
        const user = document.getElementById('reg_user').value.trim();
        const pass = document.getElementById('reg_pass').value;
        const confirmPass = document.getElementById('reg_confirm_pass').value;

        // เช็คว่าง
        if (!user || !pass || !confirmPass) {
            showCustomAlert("กรุณากรอกข้อมูลให้ครบ!", "error");
            return;
        }

        if (!/^[a-zA-Z0-9._-]{3,15}$/.test(user)) {
            showCustomAlert("ชื่อผู้ใช้ต้องยาว 3–15 ตัว และใช้ได้เฉพาะ a–z, 0–9, จุด, ขีดกลาง หรือขีดล่าง", "error");
            return;
        }

        if (pass.length < 6) {
            showCustomAlert("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร", "error");
            return;
        }

        // 🔥 เช็ครหัสไม่ตรงกัน (ขึ้นหลอดแดง)
        if (pass !== confirmPass) {
            showCustomAlert("รหัสผ่านไม่ตรงกัน!", "error");
            return;
        }

        const normalizedUser = user.toLowerCase();

        try {
            await createUserWithEmailAndPassword(auth, usernameToEmail(normalizedUser), pass);

            // ✅ สมัครสำเร็จ โชว์หลอดรุ้งสวยๆ ก่อนวาร์ป
            showCustomAlert("สมัครสำเร็จ! กำลังไปหน้าล็อกอิน...", "success");
            
            setTimeout(() => {
                window.location.href = "login.html?status=registered";
            }, 2200);

        } catch (error) {
            const message = error.code === 'auth/email-already-in-use'
                ? "ชื่อนี้มีคนใช้แล้ว!"
                : error.code === 'auth/operation-not-allowed'
                    ? "โปรดเปิดใช้งาน Email/Password ใน Firebase Authentication ก่อน"
                    : "สมัครไม่สำเร็จ กรุณาตรวจการเชื่อมต่อแล้วลองใหม่";
            showCustomAlert(message, "error");
        }
    };
</script>
</body>
</html>
