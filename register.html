<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
<button class="round-control theme-toggle auth-theme-toggle" type="button" aria-label="เปลี่ยนเป็นธีมสว่าง" aria-pressed="false">
    <span class="material-symbols-outlined" aria-hidden="true">light_mode</span>
</button>
<main class="register-page">
    <div class="register-container">
        
        <div class="pumblack">
            <a href="login.html" id="back-to-login">
                <span class="material-symbols-outlined">undo</span>
            </a>
        </div>
        
        <h2>สมัครสมาชิก</h2>
        
        <div id="register-form-box">
            <div class="input-group">
                <label for="reg_user">ชื่อผู้ใช้ (Username)</label>
                <input type="text" id="reg_user" maxlength="15" autocomplete="username" placeholder="Username (ไม่เกิน 15 ตัวอักษร)" required>
            </div>
            <div class="input-group">
                <label for="reg_pass">รหัสผ่าน</label>
                <input type="password" id="reg_pass" maxlength="15" autocomplete="new-password" placeholder="Password (ไม่เกิน 15 ตัวอักษร)" required>
            </div>
            <div class="input-group">
                <label for="reg_confirm_pass">ยืนยันรหัสผ่าน</label>
                <input type="password" id="reg_confirm_pass" maxlength="15" autocomplete="new-password" placeholder="ยืนยันรหัสผ่าน" required>
            </div>
            
            <button type="button" id="btn-create-acc" class="register-btn">สร้างบัญชี</button>
        </div>
        
        
        <p class="login-link">
            มีบัญชีอยู่แล้ว? <a href="login.html" id="direct-login-link">เข้าสู่ระบบ</a>
        </p>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    import { createPasswordCredential } from "./password-utils.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBF5t68YK-QDAC026L6c_OFYeCP-y3RHoA",
        authDomain: "wep-project-by-baross.firebaseapp.com",
        databaseURL: "https://wep-project-by-baross-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "wep-project-by-baross",
        storageBucket: "wep-project-by-baross.firebasestorage.app",
        messagingSenderId: "561116818071",
        appId: "1:561116818071:web:111006b44f0d0e8b3d57d2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function showCustomAlert(message, type = 'success') {
        const oldAlert = document.querySelector('.custom-alert');
        if (oldAlert) oldAlert.remove();

        const alertBox = document.createElement('div');
        alertBox.className = 'custom-alert';
        
        const barClass = type === 'success' ? 'progress-active' : 'progress-error';
        const icon = type === 'success' ? '✅' : '❌'; 
        const content = document.createElement('div');
        content.className = 'alert-content';
        const iconElement = document.createElement('span');
        iconElement.className = 'alert-icon';
        iconElement.textContent = icon;
        const messageElement = document.createElement('span');
        messageElement.className = 'alert-message';
        messageElement.textContent = message;
        const progress = document.createElement('div');
        progress.className = `progress-bar ${barClass}`;
        content.append(iconElement, messageElement);
        alertBox.append(content, progress);
        
        document.body.appendChild(alertBox);

        setTimeout(() => { alertBox.style.opacity = '1'; }, 10);

        const visibleDuration = type === 'error' ? 5000 : 2000;
        setTimeout(() => {
            alertBox.style.opacity = '0';
            setTimeout(() => alertBox.remove(), 500);
        }, visibleDuration);
    }

    document.getElementById('btn-create-acc').onclick = async () => {
        const user = document.getElementById('reg_user').value.trim();
        const pass = document.getElementById('reg_pass').value;
        const confirmPass = document.getElementById('reg_confirm_pass').value;

        if (!user || !pass || !confirmPass) {
            showCustomAlert("กรุณากรอกข้อมูลให้ครบ!", "error");
            return;
        }

        if (!/^[a-zA-Z0-9_-]{1,15}$/.test(user)) {
            showCustomAlert("ชื่อผู้ใช้ใช้ได้เฉพาะ a–z, 0–9, ขีดกลาง และขีดล่าง (ไม่เกิน 15 ตัว)", "error");
            return;
        }

        if (pass !== confirmPass) {
            showCustomAlert("รหัสผ่านไม่ตรงกัน!", "error");
            return;
        }

        const normalizedUser = user.toLowerCase();
        const userRef = ref(db, `users/${normalizedUser}`);

        try {
            const snapshot = await get(userRef);
            const existingUser = snapshot.val();
            if (snapshot.exists() && (existingUser.passwordHash || typeof existingUser.password === 'string')) {
                showCustomAlert("ชื่อนี้มีคนใช้แล้ว", "error");
                return;
            }

            const passwordCredential = await createPasswordCredential(pass);
            await set(userRef, {
                username: normalizedUser,
                ...passwordCredential,
                reg_date: new Date().toISOString()
            });

            showCustomAlert("สมัครสำเร็จ! กำลังไปหน้าล็อกอิน...", "success");
            
            setTimeout(() => {
                window.location.href = "login.html?status=registered";
            }, 2200);

        } catch (error) {
            console.error('Firebase Database registration failed:', error);
            const message = /PERMISSION_DENIED/i.test(error.message || '')
                ? 'Firebase Database ปฏิเสธการบันทึก ตรวจสอบ Realtime Database Rules'
                : `สมัครไม่สำเร็จ: ${error.message || error.code || 'ตรวจสอบการเชื่อมต่อ Firebase'}`;
            showCustomAlert(message, "error");
        }
    };
</script>
<script src="theme.js"></script>
</body>
</html>
