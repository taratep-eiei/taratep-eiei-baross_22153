<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
<button class="round-control theme-toggle auth-theme-toggle" type="button" aria-label="เปลี่ยนเป็นธีมสว่าง" aria-pressed="false">
    <span class="material-symbols-outlined" aria-hidden="true">light_mode</span>
</button>
<main class="login-page">
    <div class="login-container">
        <div class="pumblack">
            
            <a href="index.html">
                <span class="material-symbols-outlined">undo</span>
            </a>
        </div>
        <div class="pum"><h2>เข้าสู่ระบบ</h2></div>
        
        <div id="login-form">
            <div class="input-group">
                <label for="username-input">ชื่อผู้ใช้งาน</label>
                <input type="text" id="username-input" autocomplete="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <label for="password-input">รหัสผ่าน</label>
                <input type="password" id="password-input" autocomplete="current-password" placeholder="Password" required>
            </div>
            <button type="button" id="login-btn-main" class="login-btn">Login</button>
        </div>
        
        
        <p class="register-link">ยังไม่มีบัญชี? <a href="register.html" id="link-to-reg">สมัครสมาชิก</a></p>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBF5t68YK-QDAC026L6c_OFYeCP-y3RHoA",
        authDomain: "wep-project-by-baross.firebaseapp.com",
        databaseURL: "https://wep-project-by-baross-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "wep-project-by-baross",
        storageBucket: "wep-project-by-baross.firebasestorage.app",
        messagingSenderId: "561116818071",
        appId: "1:561116818071:web:111006b44f0d0e8b3d57d2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const usernameToEmail = (username) =>
        `${username.toLowerCase()}@users.wep-project-by-baross.firebaseapp.com`;

    function showCustomAlert(message, type = 'success') {
        const alertBox = document.createElement('div');
        alertBox.className = 'custom-alert';
        const barClass = type === 'success' ? 'progress-active' : 'progress-error';
        const messageElement = document.createElement('span');
        messageElement.textContent = message;
        const progress = document.createElement('div');
        progress.className = `progress-bar ${barClass}`;
        alertBox.append(messageElement, progress);
        document.body.appendChild(alertBox);

        const visibleDuration = type === 'error' ? 5000 : 2000;
        setTimeout(() => {
            alertBox.style.opacity = '0';
            setTimeout(() => alertBox.remove(), 500);
        }, visibleDuration);
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('status') === 'registered') {
        showCustomAlert("สมัครสำเร็จ", "success");
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    const loginBtn = document.getElementById('login-btn-main');
    if (loginBtn) {
        loginBtn.onclick = async () => {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value;

            if (username === "" || password === "") {
                showCustomAlert("กรุณากรอกข้อมูลให้ครบ", "error");
                return;
            }

            if (!/^[a-zA-Z0-9._-]{3,15}$/.test(username)) {
                showCustomAlert("ชื่อผู้ใช้ไม่ถูกต้อง", "error");
                return;
            }

            try {
                const normalizedUsername = username.toLowerCase();
                try {
                    await signInWithEmailAndPassword(auth, usernameToEmail(normalizedUsername), password);
                } catch (authError) {
                    const canMigrate = authError.code === 'auth/invalid-credential' ||
                        authError.code === 'auth/user-not-found' ||
                        authError.code === 'auth/invalid-login-credentials';
                    if (!canMigrate) throw authError;

                    
                    let legacyRef = ref(db, `users/${normalizedUsername}`);
                    let legacySnapshot = await get(legacyRef);
                    let legacyUser = legacySnapshot.val();
                    if (!legacySnapshot.exists() && username !== normalizedUsername) {
                        legacyRef = ref(db, `users/${username}`);
                        legacySnapshot = await get(legacyRef);
                        legacyUser = legacySnapshot.val();
                    }
                    if (!legacySnapshot.exists() || legacyUser.password !== password) throw authError;

                    const credential = await createUserWithEmailAndPassword(
                        auth,
                        usernameToEmail(normalizedUsername),
                        password
                    );
                    await update(legacyRef, {
                        password: null,
                        uid: credential.user.uid,
                        username: normalizedUsername,
                        migrated_at: new Date().toISOString()
                    });
                }
                localStorage.setItem('savedUsername', username.toLowerCase());
                showCustomAlert("ยินดีต้อนรับ กำลังเข้าสู่ระบบ...", "success");
                setTimeout(() => { window.location.href = "index.html"; }, 1200);
            } catch (error) {
                console.error('Firebase sign-in failed:', error);
                const messageByCode = {
                    'auth/invalid-credential': 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
                    'auth/invalid-login-credentials': 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง',
                    'auth/user-not-found': 'ไม่พบบัญชีนี้ใน Firebase Authentication',
                    'auth/operation-not-allowed': 'โปรเจกต์ Firebase ยังไม่เปิด Email/Password ใน Authentication',
                    'auth/unauthorized-domain': 'โดเมนเว็บนี้ยังไม่ได้เพิ่มใน Firebase Authentication > Settings > Authorized domains',
                    'auth/network-request-failed': 'เชื่อมต่อ Firebase ไม่ได้ ตรวจอินเทอร์เน็ตและเปิดเว็บผ่าน localhost หรือ HTTPS',
                    'auth/invalid-api-key': 'Firebase API key ไม่ถูกต้อง กรุณาตรวจ firebaseConfig',
                    'auth/too-many-requests': 'Firebase ระงับการลองชั่วคราว กรุณารอสักครู่แล้วลองใหม่'
                };
                const message = messageByCode[error.code] ||
                    (/PERMISSION_DENIED/i.test(error.message || '')
                        ? 'Firebase Realtime Database ปฏิเสธการย้ายบัญชีเดิม กรุณาตรวจ Database Rules'
                        : `เข้าสู่ระบบไม่สำเร็จ (${error.code || 'unknown'})`);
                showCustomAlert(message, "error");
            }
        };
    }

    
</script>
<script src="theme.js"></script>
</body>
</html>
