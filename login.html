<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
<button class="round-control theme-toggle auth-theme-toggle" type="button" aria-label="เปลี่ยนเป็นธีมสว่าง" aria-pressed="false">
    <span class="material-symbols-outlined" aria-hidden="true">light_mode</span>
</button>
<main class="login-page">
    <div class="login-container">
        <div class="pumblack"><a href="index.html"><span class="material-symbols-outlined">undo</span></a></div>
        <div class="pum"><h2>เข้าสู่ระบบ</h2></div>
        <div id="login-form">
            <div class="input-group">
                <label for="username-input">ชื่อผู้ใช้งาน</label>
                <input type="text" id="username-input" autocomplete="username" placeholder="Username" maxlength="15" required>
            </div>
            <div class="input-group">
                <label for="password-input">รหัสผ่าน</label>
                <input type="password" id="password-input" autocomplete="current-password" placeholder="Password" maxlength="15" required>
            </div>
            <button type="button" id="login-btn-main" class="login-btn">เข้าสู่ระบบ</button>
        </div>
        <p class="register-link">ยังไม่มีบัญชี? <a href="register.html" id="link-to-reg">สมัครสมาชิก</a></p>
    </div>
</main>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    import { createPasswordCredential, verifyPassword } from "./password-utils.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBF5t68YK-QDAC026L6c_OFYeCP-y3RHoA",
        authDomain: "wep-project-by-baross.firebaseapp.com",
        databaseURL: "https://wep-project-by-baross-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "wep-project-by-baross",
        storageBucket: "wep-project-by-baross.firebasestorage.app",
        messagingSenderId: "561116818071",
        appId: "1:561116818071:web:111006b44f0d0e8b3d57d2"
    };

    const db = getDatabase(initializeApp(firebaseConfig));

    function showCustomAlert(message, type = 'success') {
        const oldAlert = document.querySelector('.custom-alert');
        if (oldAlert) oldAlert.remove();
        const alertBox = document.createElement('div');
        alertBox.className = 'custom-alert';
        const messageElement = document.createElement('span');
        messageElement.textContent = message;
        const progress = document.createElement('div');
        progress.className = `progress-bar ${type === 'success' ? 'progress-active' : 'progress-error'}`;
        alertBox.append(messageElement, progress);
        document.body.appendChild(alertBox);
        const duration = type === 'error' ? 5000 : 2000;
        setTimeout(() => {
            alertBox.style.opacity = '0';
            setTimeout(() => alertBox.remove(), 500);
        }, duration);
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('status') === 'registered') {
        showCustomAlert('สมัครสำเร็จ', 'success');
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    document.getElementById('login-btn-main').onclick = async () => {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value;
        if (!username || !password) {
            showCustomAlert('กรุณากรอกข้อมูลให้ครบ', 'error');
            return;
        }
        if (!/^[a-zA-Z0-9_-]{1,15}$/.test(username)) {
            showCustomAlert('ชื่อผู้ใช้ใช้ได้เฉพาะ a-z, 0-9, ขีดกลาง และขีดล่าง (ไม่เกิน 15 ตัว)', 'error');
            return;
        }

        const normalizedUsername = username.toLowerCase();
        try {
            const userRef = ref(db, `users/${normalizedUsername}`);
            const snapshot = await get(userRef);
            if (!snapshot.exists()) {
                showCustomAlert('ไม่พบชื่อผู้ใช้นี้', 'error');
                return;
            }
            const user = snapshot.val();
            let valid = await verifyPassword(password, user);
            if (!valid && typeof user.password === 'string') {
                valid = user.password === password;
                if (valid) {
                    const credential = await createPasswordCredential(password);
                    await update(userRef, { password: null, ...credential, username: normalizedUsername });
                }
            }
            if (!valid) {
                showCustomAlert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
                return;
            }
            localStorage.setItem('savedUsername', normalizedUsername);
            showCustomAlert('ยินดีต้อนรับ กำลังเข้าสู่ระบบ...', 'success');
            setTimeout(() => { window.location.href = 'index.html'; }, 1200);
        } catch (error) {
            console.error('Database sign-in failed:', error);
            const message = /PERMISSION_DENIED/i.test(error.message || '')
                ? 'Firebase Database ปฏิเสธการอ่านข้อมูล กรุณาตรวจสอบ Realtime Database Rules'
                : `เข้าสู่ระบบไม่สำเร็จ: ${error.message || error.code || 'ตรวจสอบการเชื่อมต่อ Firebase'}`;
            showCustomAlert(message, 'error');
        }
    };
</script>
<script src="theme.js"></script>
</body>
</html>
